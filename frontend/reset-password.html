<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Parking Management | Reset Password</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="icon" href="public/favicon.ico" />
  </head>
  <body data-page="reset-password" class="auth-hero">
    <div class="auth-overlay"></div>

    <main class="auth-hero-shell">
      <section class="hero-left">
        <div class="hero-kicker">Smart Parking Management</div>
        <h1 class="hero-title">Create a new password</h1>
        <p class="hero-text">
          Paste the reset code you received and choose a strong new password.
        </p>
        <div class="hero-meta">Set a new password.</div>
      </section>

      <section class="hero-right">
        <div class="hero-card">
          <h2 class="hero-form-title">Reset access</h2>
          <form id="resetPasswordForm" class="hero-form">
            <label for="resetToken">Reset code</label>
            <input id="resetToken" name="token" type="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" required />

            <label for="resetPassword">New password</label>
            <div class="input-group">
              <input id="resetPassword" name="password" type="password" autocomplete="new-password" required />
              <button type="button" class="toggle-visibility" data-target="resetPassword" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.3 21.3 0 0 1 5.17-6.26"></path>
                  <path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.47-5.47"></path>
                  <path d="M1 1l22 22"></path>
                </svg>
              </button>
            </div>

            <label for="resetPasswordConfirm">Confirm password</label>
            <div class="input-group">
              <input id="resetPasswordConfirm" name="confirm_password" type="password" autocomplete="new-password" required />
              <button type="button" class="toggle-visibility" data-target="resetPasswordConfirm" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.3 21.3 0 0 1 5.17-6.26"></path>
                  <path d="M9.53 9.53A3 3 0 0 0 12 15a3 3 0 0 0 2.47-5.47"></path>
                  <path d="M1 1l22 22"></path>
                </svg>
              </button>
            </div>

            <button class="hero-button" type="submit">Reset password</button>
          </form>

          <div id="resetPasswordMessage" class="helper"></div>
          <div class="hero-links">
            <a href="index.html">Back to login</a>
          </div>
          <div class="hero-terms">Passwords must be at least 8 characters.</div>
        </div>
      </section>
    </main>

    <script src="assets/js/runtime-config.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>

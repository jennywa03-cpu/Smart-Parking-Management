<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Parking Management | Forgot Password</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="icon" href="public/favicon.ico" />
  </head>
  <body data-page="forgot-password" class="auth-hero">
    <div class="auth-overlay"></div>

    <main class="auth-hero-shell">
      <section class="hero-left">
        <div class="hero-kicker">Smart Parking Management</div>
        <h1 class="hero-title">Forgot your password?</h1>
        <p class="hero-text">
          Enter your email and we will generate a reset code. In production, the code is sent
          to the account email.
        </p>
        <div class="hero-meta">Password recovery</div>
      </section>

      <section class="hero-right">
        <div class="hero-card">
          <h2 class="hero-form-title">Reset access</h2>
          <form id="forgotPasswordForm" class="hero-form">
            <label for="forgotEmail">Email Address</label>
            <input id="forgotEmail" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required />
            <button class="hero-button" type="submit">Send reset code</button>
          </form>

          <div id="forgotPasswordMessage" class="helper"></div>
          <div id="resetTokenHint" class="helper"></div>

          <div class="hero-links">
            <a href="reset-password.html">Already have a code?</a>
          </div>
          <div class="hero-links">
            <a href="index.html">Back to login</a>
          </div>
          <div class="hero-terms">
            Use the reset code before it expires.
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/runtime-config.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
